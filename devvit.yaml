name: mod-vigil
version: 0.0.1
description: Real-time moderation analytics and automation dashboard
runtime: node20
permissions:
  - modMail
  - modLog
  - modContributors
  - privateMessages
  - identity
  - read
triggers:
  - event: ModAction
    handler: src/main.tsx
  - event: AppInstall
    handler: src/main.tsx
  - event: AppUpgrade
    handler: src/main.tsx
scheduledJobs:
  - name: spikeChecker
  - name: weeklyDigest
  - name: baselineUpdater
settings:
  - name: spikeThreshold
    label: 'Spike Alert Threshold (default: 3.0)'
    type: number
    defaultValue: 3
    scope: installation
  - name: transparencyMode
    label: Public Transparency Mode
    type: boolean
    defaultValue: false
    scope: installation
  - name: enableWarnings
    label: Enable Automated User Warnings
    type: boolean
    defaultValue: true
    scope: installation
