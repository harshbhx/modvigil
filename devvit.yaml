name: modvigil
version: 0.0.1
description: Real-time moderation analytics and automation dashboard
runtime: node20

permissions:
  - modMail
  - modLog
  - modContributors
  - privateMessages
  - identity
  - read

triggers:
  - event: ModAction
    handler: src/main.ts
  - event: AppInstall
    handler: src/main.ts
  - event: AppUpgrade
    handler: src/main.ts

scheduledJobs:
  - name: spikeChecker
  - name: weeklyDigest
  - name: baselineUpdater

settings:
  - name: spikeThreshold
    label: "Spike Alert Threshold (default: 3.0)"
    type: number
    defaultValue: 3.0
    scope: installation
  - name: transparencyMode
    label: "Public Transparency Mode"
    type: boolean
    defaultValue: false
    scope: installation
